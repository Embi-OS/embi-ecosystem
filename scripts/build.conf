# Local build configuration (sourced by common.sh if renamed to build.conf)
# Copy this file to build.conf and adjust values to match your system.

# Qt installation root
QT_ROOT="$HOME/Qt"
QT_ROOT_WINDOWS="/c/Qt"

# Qt version
IFW_VERSION="4.11"
QT_VERSION="6.8.7"
B2QT_KIT="apalis-imx8"

# Emscripten SDK root (for WASM builds)
EMSCRIPTEN_PATH="/opt/emsdk"

# Generator and build type
GENERATOR="Ninja"
BUILD_TYPE="Release"
REBUILD=0
OPTIMIZATION="OFF"

# Project metadata
PROJECT_NAME="Embi-Ecosystem"
PROJECT_VERSION="1.0.0"
PROJECT_VERSION_SUFFIX="beta.1"
PROJECT_VERSION_CODENAME=""
PROJECT_BRANCH="mmc"

# Base config for Yocto build
YOCTO_DIR="$HOME/A_EMBI_OS_BUILD"
YOCTO_KAS_FILE="embi-kas/latest.yml"
YOCTO_MACHINE="$B2QT_KIT"
YOCTO_IMAGE_NAME="embi-image"
YOCTO_IMAGE_EXTENSION="tezi.tar"
BITBAKE_EXTRA_ARGS="" # extra bitbake flags forwarded as: kas build <kas.yml> -- ...
