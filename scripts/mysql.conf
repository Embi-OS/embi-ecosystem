# Local MySQL Qt SQL driver configuration.
# This file is sourced by mysql_linux.sh and mysql_windows.sh.

# Linux Qt kit and optional MySQL/MariaDB client paths.
MYSQL_LINUX_QT_KIT="${MYSQL_LINUX_QT_KIT:-gcc_64}"
MYSQL_LINUX_ROOT="${MYSQL_LINUX_ROOT:-}"
MYSQL_LINUX_INCLUDE_DIR="${MYSQL_LINUX_INCLUDE_DIR:-}"
MYSQL_LINUX_LIBRARY="${MYSQL_LINUX_LIBRARY:-}"

# Windows Qt kit and optional MySQL/MariaDB client paths.
# mysql_windows.sh accepts Git Bash paths and Windows paths.
MYSQL_WINDOWS_QT_KIT="${MYSQL_WINDOWS_QT_KIT:-mingw_64}"
MYSQL_WINDOWS_COMPILER_TOOLS_DIR="${MYSQL_WINDOWS_COMPILER_TOOLS_DIR:-mingw1310_64}"
MYSQL_WINDOWS_ROOT="${MYSQL_WINDOWS_ROOT:-}"
MYSQL_WINDOWS_INCLUDE_DIR="${MYSQL_WINDOWS_INCLUDE_DIR:-}"
MYSQL_WINDOWS_LIBRARY="${MYSQL_WINDOWS_LIBRARY:-}"

# Build both Release and Debug plugin variants when supported by the generator.
MYSQL_CMAKE_CONFIGURATION_TYPES="${MYSQL_CMAKE_CONFIGURATION_TYPES:-Release;Debug}"
